# ===== GawharaGate =====
# تشترط هذه الإضافة أن يكون اللاعب عضوًا في خادم ديسكورد «البرج» كي يدخل خادم ماينكرافت.
#
# آلية العمل:
#  1) إذا دخل لاعب لم يربط حسابه، يُرفض دخوله ويظهر له رمز ربط ورابط الدعوة.
#  2) ينضم اللاعب إلى ديسكورد، ثم يرسل الرمز في رسالة خاصة (DM) إلى البوت، فيُربط حسابه.
#  3) عند كل دخول بعد ذلك تتحقق الإضافة من أن صاحب الحساب المربوط ما زال عضوًا في ديسكورد.
#
# إعداد البوت (مرة واحدة):
#  - افتح https://discord.com/developers/applications ← New Application ← Bot ← Reset Token وانسخ الرمز.
#  - فعّل خيار «Server Members Intent» من صفحة البوت (احتياطًا).
#  - ادعُ البوت إلى خادم ديسكورد برابط من OAuth2 ← URL Generator بنطاقين:
#    bot و applications.commands (لا يلزم منحه صلاحيات إضافية).
#  - ضع رمز البوت أدناه ثم نفّذ /gate reload

discord:
  bot-token: ""                       # سرّي: لا تشاركه مع أحد
  guild-id: "883871561474539630"      # معرّف خادم ديسكورد «البرج»
  invite-url: "https://discord.gg/elborg"
  guild-name: "البرج"

# طرق الربط (كلها تعمل دون المساس برابط Interactions Endpoint للتطبيق، فيمكن للتطبيق خدمة موقع في الوقت نفسه):
link:
  dm: true                 # إرسال الرمز في رسالة خاصة إلى البوت (لا يحتاج أي صلاحية خاصة)
  channel-id: "1561575253522780180"   # قناة بديلة يكتب فيها اللاعب الرمز إذا كانت رسائله الخاصة مقفلة (يتطلب تفعيل Message Content Intent من Developer Portal)
  channel-name: "#ربط-الحساب"   # اسم القناة كما يُعرض للاعب داخل اللعبة
  bot-name: "كبير البوابين"       # اسم البوت كما يظهر للاعب داخل اللعبة
  # أمر /link المائل: لا يعمل إلا إذا كان الحقل Interactions Endpoint URL فارغًا في تطبيق البوت
  slash-command: false

# اسم أمر ديسكورد المائل (يُستعمل فقط إذا فُعّل slash-command)
link-command-name: "minecraftlink"

# مدة صلاحية رمز الربط بالدقائق
code-minutes: 10

# أقصى عدد لحسابات ماينكرافت التي يمكن ربطها بحساب ديسكورد واحد
max-accounts-per-discord: 2

# مدة حفظ نتيجة التحقق الناجحة بالثواني (لتخفيف الطلبات على ديسكورد)
cache-seconds: 300

# إعادة فحص اللاعبين المتصلين كل كم دقيقة، وطرد من غادر ديسكورد (0 = تعطيل)
recheck-minutes: 10

# ماذا يحدث إذا تعذّر الاتصال بديسكورد (انقطاع أو خطأ)؟
#  allow = يُسمح بالدخول حتى لا يُحبس اللاعبون عند أعطال ديسكورد (موصى به)
#  deny  = يُمنع الدخول
on-discord-error: "allow"

# من يُعفى من الشرط
bypass:
  ops: true                           # المشرفون (OP)
  names: []                           # أسماء لاعبين، مثال: ["Steve"]
  uuids: []                           # معرّفات UUID

# الرسائل (تدعم رموز الألوان &). المتغيرات: {server} {invite} {code} {minutes} {command} {player}
messages:
  kick-not-linked:
    - "&c&lلا يمكنك الدخول بعد"
    - ""
    - "&7يشترط الانضمام إلى ديسكورد &e{server} &7وربط حسابك."
    - ""
    - "&f١) انضم إلى ديسكورد: &b{invite}"
    - "&f٢) {how}"
    - "&f٣) أعد الدخول إلى اللعبة."
    - ""
    - "&8صلاحية الرمز {minutes} دقائق."
  kick-not-member:
    - "&c&lغادرتَ ديسكورد {server}"
    - ""
    - "&7يشترط البقاء عضوًا في ديسكورد للدخول إلى الخادم."
    - "&f• أعد الانضمام: &b{invite}"
    - "&f• ثم ادخل اللعبة من جديد."
  kick-error:
    - "&c&lتعذّر التحقق من عضويتك في ديسكورد"
    - ""
    - "&7حاول مرة أخرى بعد قليل."
  how-dm: "&fأرسل رسالة خاصة إلى البوت &e{bot}&f تحتوي على الرمز: &a{code}"
  how-both: "&fأرسل الرمز &a{code}&f في رسالة خاصة للبوت &e{bot}&f، أو إن كانت رسائلك الخاصة مقفلة فاكتبه في قناة &e{channel}"
  how-channel: "&fاكتب الرمز &a{code}&f في قناة &e{channel}"
  how-slash: "&fاكتب الأمر &a/{command}&f ثم أدخل الرمز: &e{code}"
  link-dm-help: "أرسل لي هنا رمز الربط المكوّن من 6 خانات الذي ظهر لك داخل اللعبة."
  link-not-member: "يجب أن تكون عضوًا في خادم {server} أولًا. انضم من هنا: {invite}"
  link-success: "تم ربط حسابك في ماينكرافت ({player}) بحسابك في ديسكورد. يمكنك الآن الدخول إلى الخادم."
  link-invalid: "الرمز غير صحيح أو انتهت صلاحيته. ادخل إلى اللعبة مجددًا للحصول على رمز جديد."
  link-limit: "بلغ حسابك الحد الأقصى من الحسابات المربوطة ({max})."
  link-already: "حسابك في ماينكرافت ({player}) مربوط مسبقًا بحساب ديسكورد آخر."
  command-description: "ربط حسابك في ماينكرافت بحسابك في ديسكورد"
  option-description: "الرمز الذي ظهر لك داخل اللعبة"
